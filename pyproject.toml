[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthstar"
version = "0.1.0"
description = "General generator of synthetic variable stars: their time-varying SEDs and light curves, built by orchestrating stellar models (MESA, PHOEBE, sncosmo), 3D dust and synthetic photometry. Survey- and instrument-agnostic."
requires-python = ">=3.10"
dependencies = ["numpy", "astropy", "h5py", "scipy", "dustmaps"]

[project.optional-dependencies]
physics = ["sncosmo"]   # PHOEBE / MESA are external tools, not pip deps

[tool.setuptools.packages.find]
include = ["synthstar*"]
