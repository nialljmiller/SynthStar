# Alerts fix iteration 2 (2026-10-26): alert_sample_v1_f294_784m11_623_20260910 beta (same field, night, seeds and
# injected stars) with the simulation's WCS and zero point in place of hdps's solve (TrueCalibrationTask, in both the
# reference and the science pass), each star's light centred on its position (sensor.py, 1/16 px), no PSF wing (the
# demo chat's M45 tests: the wing at 400 or 30 px over-subtracts stars in hdps's difference images), and both movies
# to judge the difference images. v1 beta: 59 of 112 exposures with candidates, 2231 packets, 148 bogus. iter1 (true
# calibration only): 112 of 112, 4981 packets, 375 unmatched; bright-star |diff|/flux 0.199, dipole 0.225 px.
[field]
name = "iter2_f294_784m11_623_20260910_beta"
ra = 294.784
dec = -11.623

[night]
date = "2026-09-10"
nights = 1

[stars]
background = "f294_784m11_623_field"
layout = "real"

[inject]
number = 200
seed = 1000

[image]
psf_wing = false

[output]
bands = ["beta"]
movie = true
pipeline_movie = true
movie_data = true
lightcurves = false
catalogues = false
stride = 1

[[hdps.tasks]]
type = "DataCleanupTask"

[[hdps.tasks]]
type = "ImageReductionTask"

[[hdps.tasks]]
type = "SourceDetectionTask"

[[hdps.tasks]]
type = "SourceFilterTask"

[[hdps.tasks]]
type = "TrueCalibrationTask"  # in place of ReferenceRetrieval, LinearWCSSolver, SourceMatching, TPVWCSSolver

[[hdps.tasks]]
type = "LightweightFITSOutputTask"

[[hdps.tasks]]
type = "ReprojectionTask"

[[hdps.tasks]]
type = "CoaddTapTask"

[[hdps.tasks]]
type = "SFFTSubtractionTask"

[[hdps.tasks]]
type = "DiffDetectionTask"

[[hdps.tasks]]
type = "TransientOutputTask"

[[hdps.tasks]]
type = "AlertVettingTask"
[hdps.tasks.config]
model_bundle = "data/rb/bundle_v1"
score_cut = "fa10"
emit_all_candidates = true

[[hdps.tasks]]
type = "TileImageOutputTask"
