# An observation: the one file that defines a run. Written by python -m mesa_argus.schema; every parameter with its
# default, unit, allowed values and the justification.

[field]
# [deg] allowed: 0.0 .. 360.0. ICRS right ascension of the field (the block's centre).
ra = "required"
# [deg] allowed: -90.0 .. 90.0. ICRS declination; whether Argus can see it at all is ArgusSim's coverage (observe.py
# stops when no exposure covers it).
dec = "required"
# allowed: any. Output folder name; "": the observation file's name.
name = ""
# [minipix] allowed: 1 .. 64. Side of the block shown in the movie and followed in the summary, in hdps minipixes (32
# tile px, 28.1"). At most 64: one hdps tile (2048 px) is 64 x 64 minipixes.
block = 9
# [minipix] allowed: 0, or 28 .. the sensor's short side (313 for ArgusSim's default sensor). Side of the simulated
# readout window, in minipixes, centred on the field's position on the sensor (shifted to stay on it); 0: the whole
# sensor (ArgusSim telescope.n_pixels_x x n_pixels_y). A real camera can read out a window (XORIGIN, YORIGIN, XSIZE,
# YSIZE in its header). At least 28 (782 px): hdps's source detector needs 3 of its 256 px background regions across.
# Default 56 (1564 px, 26.3'): of the windows tried, the one hdps handles best end to end (16 exposures of f294,
# 2026-10-21: WCS solved 13/16, every touched tile reprojected 11/16; 28: 14/16 and 0/16, 40: 14/16 and 7/16, 80:
# 11/16 and 0/16; production processes whole frames). The field's Gaia stars must reach the window's far corner:
# radius ~0.5 deg for 56.
window = 56
# [arcmin] allowed: [east, north]: the block inside the window, the far corner within 0.52 deg. Where the readout
# window's centre lies from the field (the block's centre), [east, north]; the block stays on the field, only the
# window moves. [0, 0]: the window centred on the field. A real Argus frame is centred on the telescope's pointing,
# not on a target, so a target generally sits off-centre. hdps's linear WCS solver starts from the detections in a
# circle about the frame centre; with a crowded target there (M3's core) it accepts false alignments with the pixel
# scale 5-15x wrong and every tile is dropped (docs/ARGUS_INTEGRATION.md, 2026-10-24), so such a target is observed
# off-centre. Limits: the block stays inside the window, and the window's far corner within the field's Gaia stars
# (0.52 deg); 0 for the whole sensor (window = 0).
window_offset = [0.0, 0.0]

[night]
# allowed: YYYY-MM-DD | "auto". Local date of the first night (the night starts on that evening); "auto": the night
# the placed real stars change most.
date = "auto"
# [nights] allowed: 1 .. 366. Consecutive nights observed. 7 is the standard observation (a week); up to a year.
nights = 7
# allowed: [] or a list of night numbers 1..nights. Observe only these of the nights (1: the first): the scene
# (transient times over all the nights), the reference and every exposure are made as for all of them and only these
# nights' exposures are observed, so runs of different nights add up to one observation of all of them (a week split
# across machines). Such a run draws its frames' noise from output.noise_seed + its first night here (the engine seeds
# a frame by its order in the run, so runs of different nights would otherwise repeat each other's noise); its
# reference keeps output.noise_seed. []: every night.
only_nights = []
# allowed: 0 .. 2147483647. Seed of ArgusSim's per-ratchet draws (seasonal zenith seeing); the same seed makes the
# same nights.
seed = 0
# [nights] allowed: 1 .. 200. Nights observed before the first night to make hdps's references (its coadd bootstrap:
# pass 1 coadds these nights' frames with CoaddTapTask, pass 2 subtracts against those coadds; docker/demo/config.yaml
# header). Same stars, transients left out. 1: the night before. Up to 200 for reference_geometry_px: a telescope's
# view of a field repeats only every few weeks (f294 2026-09-10: every telescope within 122 px of tonight's sensor
# position on 07-31, within ~257 px on 08-23).
reference_nights = 1
# [ratchets] allowed: 0 .. 100. The reference nights' ratchets each telescope keeps for its references: its N with the
# best seeing at the field (the ratchet's zenith seeing x airmass^0.6, ArgusSim's), per band; the other exposures are
# not observed. SFFT matches the reference to the frame by convolving it, so a frame sharper than its reference cannot
# be matched and its stars stay in the difference (M67 beta 2026-10-27: a frame's bright-star residual against a
# 1-night reference of all ratchets went from +17% of the star at 0.85" to -10% at 2.1", correlation -0.96 with the
# frame's seeing; ~680 hdps candidates per frame). Seeing is drawn per ratchet, so a cut within one night drops whole
# cameras (they then take another camera's coadd): use with reference_nights > 1, as Argus's references will be. 0:
# every ratchet (as before 2026-10-27).
reference_ratchets = 0
# [px] allowed: 0 .. 5000. Each telescope's reference from its own ratchets that saw the field where tonight's does on
# its sensor: within this many pixels of the field centre's sensor position in that telescope's ratchet tonight (the
# reference_ratchets best-seeing of them, those at least as sharp as tonight's first; all of them with
# reference_ratchets = 0); telescopes not observing the field tonight are not observed. A telescope's view changes
# from night to night (f294: 0.3-1.9 deg off-axis), and with it the PSF's width and shape (ArgusSim's optics: 2.6 px
# near the axis to 3.2 px at 1.9 deg, tile pixels); a reference from another position left each star's core +5 to +12%
# (frames sharper than it) or -4 to -10% (broader) of its peak in the difference (f294 beta 2026-09-10, iter3z), red
# or blue by telescope. 300 px is ~0.08 deg. None within it: the telescope's nearest ratchet, with a warning. 0: off
# (reference_ratchets alone).
reference_geometry_px = 0
# allowed: false | true. TEST ONLY: the reference from the science night's own exposures (another noise draw:
# output.noise_seed + 1), the transients left out, instead of reference_nights before it. The best any reference could
# be: what it leaves at constant stars is the subtraction's own floor (hdps's kernel fit, the reprojection of an
# undersampled PSF), which no choice of reference removes. Never for data.
reference_oracle = false
# allowed: 0.5 .. 2.0. TEST ONLY, with reference_oracle: the reference's seeing x this (its ratchets' zenith seeing
# scaled): whether a reference sharper (< 1) or broader than the frames, all else the same, leaves the stars' cores in
# the difference.
reference_oracle_seeing = 1.0
# [px] allowed: 0.0 .. 2.0. TEST ONLY, with reference_oracle: the reference's tracking angle moved so the stars land
# this many sensor pixels along the sky's east-west from tonight's: whether the stars' sub-pixel positions (an
# undersampled PSF, ~2.6 tile pixels FWHM) alone, all else the same, leave their cores in the difference.
reference_oracle_shift_px = 0.0

[stars]
# allowed: any. The star set (stars/<name>/) every field star comes from: Gaia stars of the field built by
# make_stars.py.
background = "required"
# allowed: "random" | "real". real: each star at its Gaia position; random: scattered uniformly over the window (a
# synthetic field).
layout = "real"
# allowed: 0 .. 2147483647. Seed of the random layout and random placements.
seed = 1
# allowed: "skip" | "stop". A placed star not built yet: stop the run, or skip it.
missing = "stop"
# allowed: 1 .. 64. Processes for ArgusSim's photometry of the constant stars (each MESA template through both bands
# at its stars' E(B-V) and every tabulated airmass), forked from the engine (Linux; macOS forks unsafely with
# Accelerate: keep 1 there). The results do not depend on it. 1: in the engine's own process; f065's 35k stars took 67
# min of each pass (reference and night) on newton that way.
photometry_workers = 1

[argussim.observatory]
# ArgusSim: how the image is taken. Defaults are read from ArgusSim.
# [deg] allowed: -90.0 .. 90.0. Site latitude, Mt Fowlkes (ArgusSim argus_sim/config.py). A latitude.
latitude = 30.6716
# [deg] allowed: -180.0 .. 180.0. Site longitude, east positive (ArgusSim argus_sim/config.py). A longitude.
longitude = -104.0215
# [m] allowed: -500.0 .. 9000.0. Site height (ArgusSim argus_sim/config.py). Between the lowest and highest land on
# Earth.
altitude = 2070
# [deg] allowed: 0.0 .. 90.0. Lowest altitude the array points at (ArgusSim argus_sim/config.py). Above the horizon.
min_alt = 32.84
# allowed: false | true. Zenith seeing per ratchet from the site's DIMM seasons (Barker et al. 2003; ArgusSim
# argus_sim/config.py, PI 2026-09-19).
seasonal_seeing = true
# [arcsec] allowed: > 0. Lognormal seeing, used only when seasonal_seeing is false (ArgusSim argus_sim/config.py).
# Positive.
seeing_mean = 0.87
# [arcsec] allowed: >= 0.0 (no upper limit). As seeing_mean (ArgusSim argus_sim/config.py). Not negative.
seeing_std = 0.15
# allowed: 0.0 .. 1.0. Grey transparency, 1 = photometric (ArgusSim argus_sim/config.py). A transmitted fraction.
transparency = 1.0
# [ucd/m2] allowed: >= 0.0 (no upper limit). Artificial sky glow (ArgusSim argus_sim/config.py). Not negative.
artificial_light_cd_m2 = 1.94
# allowed: 0.8 .. 2.0. Airglow scaling when survey.solar_activity_prior is "fixed"; ArgusSim's stated range, 0.8
# (solar minimum) to 2.0 (maximum) (ArgusSim argus_sim/config.py).
solar_activity = 0.8

[argussim.telescope]
# ArgusSim: how the image is taken. Defaults are read from ArgusSim.
# [mm] allowed: > 0. (ArgusSim argus_sim/config.py). Positive.
aperture_diameter = 280
# [mm] allowed: >= 0.0 (no upper limit). (ArgusSim argus_sim/config.py). Not negative; smaller than the aperture.
central_obstruction_diameter = 168
# [mm] allowed: > 0. (ArgusSim argus_sim/config.py); with pixel_size, the plate scale. Positive.
focal_length = 770.0
# [um] allowed: > 0. (ArgusSim argus_sim/config.py). Positive.
pixel_size = 3.76
# [px] allowed: >= 768 (no upper limit). Sensor long axis (ArgusSim argus_sim/config.py). At least 768: hdps's source
# detector needs 3 of its 256 px background regions across.
n_pixels_x = 11648
# [px] allowed: >= 768 (no upper limit). Sensor short axis (ArgusSim argus_sim/config.py). As n_pixels_x.
n_pixels_y = 8742
# [e-] allowed: >= 0.0 (no upper limit). (ArgusSim argus_sim/config.py). A noise: not negative.
readnoise = 1.2
# [e-/s/px] allowed: >= 0.0 (no upper limit). (ArgusSim argus_sim/config.py). A rate: not negative.
dark_current = 0.0022
# [e-] allowed: 1 .. 6553500. (ArgusSim argus_sim/config.py). Positive; with [camera] gain it must fit the 16-bit raw
# frame (fullwell / gain <= 65535), checked with [camera].
fullwell = 21657
# allowed: 0.0 .. 1.0. Multiplicative throughput degradation (ArgusSim argus_sim/config.py). A fraction.
throughput_loss = 1.0
# allowed: "gaussian" | "zemax". Delivered optics (zemax, the default since 2026-09-19) or a Gaussian spot; ArgusSim's
# two models (ArgusSim argus_sim/config.py).
psf_model = "zemax"
# [um] allowed: > 0. RMS spot radius of the Gaussian PSF (ArgusSim argus_sim/config.py). Positive.
spot_size = 3.2
# [px] allowed: > 0 or "none". Cap on the delivered EE50 diameter (ArgusSim argus_sim/config.py); none: uncapped.
# Positive.
ee50_max_px = 3.0
# allowed: false | true. (ArgusSim argus_sim/config.py)
randomize_pixel_phase = false

[argussim.packing_strategy]
# ArgusSim: how the image is taken. Defaults are read from ArgusSim.
# allowed: "A170r_1200" | "A170r_1200-strips" | "legacy1202" | "thinB" | "thinB-strips". The array's ring layout, by
# its name in ArgusSim (argus_sim.ring_layout.LAYOUTS): every telescope's pointing (alt/az), tel_id, subarray and
# band, which coverage_exact.covering observes with. Default A170r_1200, not ArgusSim's own default (thinB, 1190
# telescopes): the canonical layout (argus-hdps/array_arrangement 9206cc3, PI 2026-09-23; 1200 telescopes on 8
# subarrays, its band table 600 beta / 600 rho), adopted here 2026-10-28; runs before then used thinB. observe.py
# records it in scene/exposures.ecsv, and the engine stops when the two differ (each exposure's telescope is a row of
# this layout). The *-strips layouts assign bands by ArgusSim's strip rule instead of the table; legacy1202 is the
# pre-thinning layout.
layout_file = "A170r_1200"

[argussim.survey]
# ArgusSim: how the image is taken. Defaults are read from ArgusSim.
# [deg] allowed: -90.0 .. 0.0. Observing only with the Sun below this (ArgusSim argus_sim/config.py). Below the
# horizon.
min_sun_alt = -18
# [deg] allowed: 0.0 .. 180.0. (ArgusSim argus_sim/config.py). An angle on the sky.
min_moon_sep = 1.5
# allowed: "epoch" | "fixed". Per-night solar activity: ArgusSim's 2028-2033 prior, or observatory.solar_activity
# (ArgusSim argus_sim/config.py).
solar_activity_prior = "epoch"
# allowed: false | true. Nights gated by the site's clear fractions (ArgusSim argus_sim/config.py, PI 2026-09-19).
apply_weather = true

[argussim.schedule]
# ArgusSim: how the image is taken. Defaults are read from ArgusSim.
# [s] allowed: > 0. Exposure time (ArgusSim coverage_exact.Schedule). Positive; at most track_min, checked with it.
exptime_s = 60.0
# [min] allowed: > 0. Tracking per ratchet (Schedule). Positive.
track_min = 14.0
# [min] allowed: >= 0.0 (no upper limit). Reset per ratchet, no exposures (Schedule). Not negative.
reset_min = 1.0
# [deg] allowed: -180.0 .. 180.0. Tracking angle at a ratchet's start (Schedule). An angle.
theta_start_deg = 3.75
# [deg] allowed: -90.0 .. 0.0. Exposures with the Sun below this (Schedule). Below the horizon.
sun_alt_max_deg = -18.0

[camera]
# The toy camera (mesa_argus/camera.py): electrons to ADU, which ArgusSim does not define. none: the default
# described.
# [e-/ADU] allowed: 0.01 .. 100.0. Toy: ArgusSim defines the detector in electrons only. Default: ArgusSim's full well
# (telescope.fullwell) at hdps's raw saturation level (saturation_adu), so a full pixel is where hdps flags
# saturation; 0.373 for 21657 e- (hdps's prototype QHY600M: 0.33).
gain = "none"
# [ADU] allowed: 0 .. 65535. Toy: bias level (none in ArgusSim).
offset = 0
# [ADU] allowed: 1.0 .. 65535.0. hdps.calibration.ImageReducer's saturation_value: raw pixels at or above it are
# flagged saturated.
saturation_adu = 58000.0

[image]
# This repository's renderer (mesa_argus/sensor.py; ArgusSim has no image renderer): the PSF's outer wing.
# allowed: false | true. false: ArgusSim's PSF stamp as it is; it ends at ArgusSim's Zemax grid (28 x 28 px), so a
# bright star sits in a visible square (its light stops at ~2e-5 of the star per pixel). true: the stamp continued by
# a power law fitted to its own outer profile (mesa_argus/sensor.py PSFs), drawn out to where it falls below
# psf_wing_floor. Default false: runs as before 2026-10-26 (the v1 alert sample).
psf_wing = false
# [px] allowed: [inner, outer], 2 <= inner < outer <= 12. Radii (from the stamp's centroid) whose mean profile is
# fitted with A r^-alpha: beyond the seeing core (3 FWHM at 2" seeing), inside the stamp (its edge is 13.5-14 px from
# the centroid; 12 keeps the last annulus whole). Over 6-11 px the slope is -2.7 to -3.6 (1-2" seeing, both bands,
# every field angle), near diffraction's -3.
psf_wing_fit = [6, 11]
# [px] allowed: [inner, outer], 2 <= inner < outer <= 13, inner >= psf_wing_fit's inner. The star is drawn as the
# stamp inside the inner radius, the fitted law beyond the outer, a linear blend between (no seam where the stamp
# ends). The outer radius at most 13: the stamp reaches 13.5 px from its centroid in every direction; the inner at or
# beyond the fit's inner radius, where the law describes the stamp.
psf_wing_join = [10, 13]
# [px] allowed: 14 .. 2000. The PSF is normalised to unit flux within this radius and drawn at most this far out. At
# 400 px the r^-3 wing of a beta ~3 star (a Pleiad, ~1e10 e- in 60 s) is ~1e1 e- per pixel, below the sky's photon
# noise (~30 e-); the light beyond (2 pi A / R for r^-3) is ~0.1% of a star's. Larger costs time only for the
# brightest stars. At least 14: beyond the stamp.
psf_wing_radius = 400
# [e-/px] allowed: > 0. A star's wing is drawn out to where it falls to this: well below the sky's photon noise per
# pixel (> 15 e- in 60 s even at new Moon) and the read noise, so leaving out the rest changes nothing measurable
# while faint stars cost nothing extra. Positive.
psf_wing_floor = 0.5
# [px] allowed: an integer, 28 <= psf_box <= 301; above 28 only with psf_wing = false. The PSF stamp's side. 28:
# ArgusSim's stamp (survey.stamp_size) as it is, cut from its Zemax array of 29 px after the seeing, so a bright
# star's light stops at a square edge 14 px out (~2e-5 of the star per pixel there: ~200 e- for a 1e7 e- star).
# Larger: ArgusSim's same PSF (Zemax optics, delivered-EE50 blur, Moffat seeing) made with the Zemax array padded
# first, so the seeing blurs that edge instead of cutting it, and room for psf_halo. The optics data itself still ends
# 14.5 px out (the light falls ~1000x between 15 and 18 px): without psf_halo the square only softens. 121 holds the
# halo to 60 px (~70 tile px), where it is ~1e-9 of the star per pixel. Default 28: runs as before 2026-10-26. Not
# with psf_wing (that continues the 28 px stamp).
psf_box = 28
# [e-/px] allowed: > 0. With psf_box above 28, each star is drawn in the square outside which its PSF is below this:
# as psf_wing_floor, below the sky's photon noise and the read noise, so faint stars keep a 29 px square and cost
# nothing extra (the light they leave out is below the floor in every pixel and outside hdps's aperture). Positive.
psf_box_floor = 0.5
# allowed: true or false; true only with psf_box above 28. true: the delivered PSF's static halo, as measured on sky,
# added to ArgusSim's PSF after the seeing (needs psf_box above 28). Measured by H. Corbett (synthref halo_measure.py,
# 2026-09: hdps tile 363381, a 15 x 60 s stack, unsaturated non-variable Gaia XP stars of G 8.5-12.5, every other star
# removed, fitted over 8-60 tile px): beyond ~10 tile px the real PSF lies well above the Zemax model (~3e-5 of the
# star per pixel at 15 tile px, ~1e-5 at 20, ~2e-6 at 30), and the halo holds 3.6% (beta) / 4.0% (rho) of the core's
# light within 60 tile px. This continues the PSF past the Zemax grid, so the square goes. Default false: runs as
# before 2026-10-26.
psf_halo = false
# [[per tile px, tile px, ]] allowed: [A, r0, beta], 0 <= A < 1e-2, 1 <= r0 <= 200, 1 < beta <= 20. The beta halo's A,
# r0, beta in A [1 + (r/r0)^2]^-beta, per hdps tile pixel (0.879") as a share of the star's core light, r from the
# star in tile pixels: Corbett's fit (synthref figs/halo_profile.png, beta, 21 stars).
psf_halo_beta = [4.9e-05, 34.1, 6.0]
# [[per tile px, tile px, ]] allowed: [A, r0, beta], 0 <= A < 1e-2, 1 <= r0 <= 200, 1 < beta <= 20. As psf_halo_beta,
# for rho: Corbett's fit (synthref figs/halo_profile.png, rho, 11 stars).
psf_halo_rho = [8e-05, 28.3, 6.0]
# [px] allowed: [inner, outer], 2 <= inner < outer <= 14. With psf_halo, ArgusSim's Zemax optics are tapered (cos^2)
# from 1 at the inner radius to 0 at the outer, a circle inside their 29 px square, before the seeing; the halo
# carries the light beyond. Without it the square's corners (14.5-20.5 px out) keep optics light the sides lack, and a
# bright star shows a square inside its halo. Corbett's model that matched the measured PSF is the same: a +-12 px
# optical stamp plus the halo. The taper removes ~0.1% of the light (renormalised).
psf_halo_taper = [10, 14]
# [arcsec] allowed: 0.0 .. 0.1. Each exposure's PSF is made for its seeing rounded to this, so exposures within a step
# share one set of stamps. ArgusSim's seeing (a ratchet's zenith seeing x airmass^0.6) differs in every exposure, and
# with psf_box above 28 a new seeing costs ~0.3 s per tabulated field angle (11 across a 56-minipix window): 3.7 s of
# a 50,000-star frame's 4 s on the Mac. 0.02 changes a ~1" FWHM by at most 1%. 0: the exact seeing (runs as before
# 2026-10-27). At most 0.1 (5% at 1").
psf_seeing_step = 0.0

[hdps]
# hdps: the pipeline the raw frames go through.
# allowed: any. ATLAS-Refcat2 for ReferenceRetrievalTask (hdps docker/demo/config.yaml: RICO_CACHE_DIR/atlas_refcat2).
refcat = "~/.rico_cache/atlas_refcat2"

[hdps.coadd]
# allowed: "inverse_variance" | "mean". Frame weighting in the coadd (hdps docker/demo/config.yaml).
strategy = "inverse_variance"
# [sigma] allowed: > 0. Outlier clip on the sky-subtracted residual (hdps docker/demo/config.yaml). Positive.
clip_kappa = 3.0
# [frames] allowed: >= 1 (no upper limit). Fewest frames before clipping (hdps docker/demo/config.yaml). At least 1.
clip_min_frames = 3
# allowed: "float32" | "float64". (hdps docker/demo/config.yaml: float32, sub-1e-6 relative difference from float64).
accumulation_dtype = "float32"

# [[hdps.tasks]]: hdps's Task chain, in order, run by hdps.orchestrate's PipelineExecutor; each [hdps.tasks.config]
# holds the Task's constructor parameters.

# Toy Task TrueCalibrationTask: allowed in the chain in place of hdps's own (mesa_argus/schema.py TOY_TASKS), not in
# the default chain.

[[hdps.tasks]]
type = "DataCleanupTask"
[hdps.tasks.config]
# allowed: "float32" | "float64". hdps docker/demo/config.yaml. A float type the later Tasks take.
target_dtype = "float32"
# allowed: any. hdps docker/demo/config.yaml. Any value.
nan_replacement = 0.0

[[hdps.tasks]]
type = "ImageReductionTask"
[hdps.tasks.config]
# allowed: any. Toy camera: filled at resolve ({serial_number}); no overscan geometry, so nothing is trimmed.
camera_specs = {}
# allowed: any. Toy camera: no masters (none).
bias_path = "none"
# allowed: any. Toy camera: no masters (none).
dark_path = "none"
# allowed: any. Toy camera: no masters (none).
flat_path = "none"
# allowed: false | true. hdps docker/demo/config.yaml has true; the toy camera has no overscan.
overscan_trimming = false
# allowed: false | true. hdps docker/demo/config.yaml
bias_subtract = false
# allowed: any. none: [camera] gain (the pipeline applies it once, here).
gain = "none"
# allowed: false | true. hdps default; falls back to the CPU without CuPy.
gpu_reduce = true
# allowed: "file" | "opsdb". hdps docker/demo/config.yaml uses opsdb (the ops database); file: no database, masters
# from paths. hdps checks.
provider = "file"

[[hdps.tasks]]
type = "SourceDetectionTask"
[hdps.tasks.config]
# allowed: > 0. hdps docker/demo/config.yaml. A threshold in sigma: positive.
detect_sigma = 3.0
# allowed: >= 1 (no upper limit). hdps docker/demo/config.yaml. A size in pixels: positive. The window must be 3
# regions across (checked with [field] window).
bg_region_size = 256
# allowed: >= 1 (no upper limit). hdps default. A count: at least 1.
max_sources = 10000000
# allowed: > 0. hdps default (aperture radius). A size in pixels: positive.
flux_radius = 4.0
# allowed: > 0. hdps docker/demo/config.yaml (FWHM). A size in pixels: positive.
matched_filter_width = 4.0
# allowed: >= 1 (no upper limit). hdps default. A count: at least 1.
centroid_n_iter = 3
# allowed: 0.0 .. 1.0. hdps default. A fraction of the peak.
cr_detect_contrast = 0.25
# allowed: false | true. hdps default.
de_dup_sources = true
# allowed: > 0. hdps default. A size in pixels: positive.
de_dup_radius = 6.0
# allowed: 0.0 .. 1.0. hdps default. A fraction of 65534.
saturation_threshold = 0.9999

[[hdps.tasks]]
type = "SourceFilterTask"
[hdps.tasks.config]
# allowed: >= 0 (no upper limit). hdps default. A pixel index: not negative.
min_x = 0
# allowed: >= 0 (no upper limit). hdps default. A pixel index: not negative.
min_y = 0
# allowed: any. hdps default (none: no limit).
max_x = "none"
# allowed: any. hdps default (none: no limit).
max_y = "none"
# allowed: any. hdps default (none: no cut).
min_snr = "none"

[[hdps.tasks]]
type = "ReferenceRetrievalTask"
[hdps.tasks.config]
# allowed: "ATLAS". hdps docker/demo/config.yaml. The one provider with a local catalogue here (Refcat2).
catalog_provider = "ATLAS"
# allowed: 0.0 .. 180.0. hdps docker/demo/config.yaml. An angle on the sky; to cover a whole frame, at least the
# sensor's half-diagonal (2.0 deg for ArgusSim's).
radius_deg = 2.5
# allowed: any. hdps default.
min_mag = 0.0
# allowed: any. hdps docker/demo/config.yaml; fainter than min_mag.
max_mag = 19.1
# allowed: any. none: ArgusSim's plate scale (telescope pixel_size / focal_length); hdps's config has its prototype
# camera's 1.42.
pixscale = "none"
# allowed: false | true. hdps default.
cacheable = true
# allowed: > 0. hdps default (deg). Positive.
cache_precision = 0.1
# allowed: >= 0.0 (no upper limit). hdps default. Not negative.
cache_max_age_days = 7.0

[[hdps.tasks]]
type = "LinearWCSSolverTask"
[hdps.tasks.config]
# allowed: >= 3 (no upper limit). hdps docker/demo/config.yaml. At least 3 stars fix a linear (6-parameter) solution.
n_stars = 150

[[hdps.tasks]]
type = "SourceMatchingTask"
[hdps.tasks.config]
# allowed: > 0. hdps docker/demo/config.yaml. A threshold in sigma: positive.
n_sigma_clip = 5.0
# allowed: any. hdps docker/demo/config.yaml: [rows, columns] of matching regions.
region_shape = [4, 6]

[[hdps.tasks]]
type = "TPVWCSSolverTask"
[hdps.tasks.config]
# allowed: any. hdps docker/demo/config.yaml. A TPV term count (hdps's solver decides which it takes).
tpv_terms = 17
# allowed: >= 1 (no upper limit). hdps docker/demo/config.yaml. A count: at least 1.
niter = 3
# allowed: > 0. hdps default. A threshold in sigma: positive.
n_sigma_clip = 5.0
# allowed: false | true. hdps docker/demo/config.yaml
use_annealing = true
# allowed: false | true. hdps docker/demo/config.yaml
use_chebyshev = true

[[hdps.tasks]]
type = "LightweightFITSOutputTask"
[hdps.tasks.config]
# allowed: any. hdps default; unused in the worker (its product goes to the data-products sink, fits_image).
output_dir = "./solved"

[[hdps.tasks]]
type = "ReprojectionTask"
[hdps.tasks.config]
# allowed: any. hdps default: the 2048 x 2048 px tile of hdps's sky segmentation; fixed by that scheme.
segment_shape = [2048, 2048]
# allowed: >= 2 (no upper limit). hdps default. A grid of at least 2 points per axis.
grid_resolution = 33

[[hdps.tasks]]
type = "CoaddTapTask"
[hdps.tasks.config]
# allowed: "regional" | "scalar". hdps docker/demo/config.yaml. hdps checks.
background_mode = "regional"

[[hdps.tasks]]
type = "SFFTSubtractionTask"
[hdps.tasks.config]
# allowed: "coadd" | "first_frame". hdps docker/demo/config.yaml: coadd, the references are earlier coadds (its
# reference_dir: the run's reference pass, set by mesa_argus.hdps_worker).
reference_mode = "coadd"
# allowed: >= 1 (no upper limit). hdps default. hdps checks it is below the tile overlap minus 2 px.
kernel_half_width = 6
# allowed: >= 0 (no upper limit). hdps docker/demo/config.yaml. A polynomial order: not negative.
kernel_poly_order = 0
# allowed: >= 0 (no upper limit). hdps docker/demo/config.yaml (2 beats 1). A polynomial order: not negative.
background_order = 2
# allowed: false | true. hdps default.
mask_saturated_in_fit = true
# allowed: false | true. true (hdps_full_cpu; hdps main has no such setting and fits across them): pixels with no
# reference or no science data kept out of the kernel fit. Fitting across them gives the kernel a flat pedestal (a
# kernel-sized square around every star) and a background gradient.
mask_no_coverage_in_fit = true
# allowed: false | true. hdps docker/demo/config.yaml and hdps default: false. True keeps bright-star residual
# footprints out of detection (inf Var(D); the kernel fit is unchanged), but hdps thresholds the science tile with its
# sky still in, so nothing brighter than about beta 15 can alert and a bright-sky tile is masked whole
# (docs/ARGUS_INTEGRATION.md). Off, as Argus runs: the alerts are the ones Argus would send (true until 2026-10-25).
mask_bright_stars = false
# allowed: > 0. electrons per pixel in the reference (sky-subtracted coadd) or the science tile (which still holds its
# sky, ~1000-1300 e- in rho here): above the science sky, or the whole science tile is masked. hdps default 5000.
bright_star_threshold = 3000.0
# allowed: >= 0 (no upper limit). hdps default: px added to the mask radius per magnitude above the threshold.
mask_dilation_growth = 4
# allowed: "direct" | "fft". hdps default. hdps checks.
variance_conv = "direct"
# allowed: >= 0 (no upper limit). hdps docker/demo/config.yaml. A count: not negative.
rejection_iters = 1
# allowed: > 0. hdps docker/demo/config.yaml. A threshold in sigma: positive.
rejection_sigma = 3.0
# allowed: >= 0 (no upper limit). hdps docker/demo/config.yaml. Pixels: not negative.
rejection_grow = 2
# allowed: false | true. true (hdps default false): AlertVettingTask's ref/sci stamps need the pre-subtraction planes
# (its emit_stamps note).
retain_planes = true

[[hdps.tasks]]
type = "DiffDetectionTask"
[hdps.tasks.config]
# allowed: > 0. hdps docker/demo/config.yaml. A threshold in sigma: positive.
detect_sigma = 5.0
# allowed: >= 1 (no upper limit). hdps docker/demo/config.yaml. A size in pixels: positive.
bg_region_size = 256
# allowed: >= 1 (no upper limit). hdps default. A count: at least 1.
max_sources = 100000
# allowed: > 0. hdps default (FWHM). A size in pixels: positive.
matched_filter_width = 4.0

[[hdps.tasks]]
type = "TransientOutputTask"
[hdps.tasks.config]
# allowed: "csv" | "parquet". hdps docker/demo/config.yaml. hdps checks.
fmt = "parquet"

[[hdps.tasks]]
type = "AlertVettingTask"
[hdps.tasks.config]
# allowed: false | true. hdps docker/demo/config.yaml has false (no classifier deployed); true here: the alerts are an
# output.
enabled = true
# allowed: any. "": no model, every candidate scores 1 (decision 2026-10-20); else a bundle directory
# (tools/train_rb.py, or hdps's own), which hdps's RFBundleClassifier loads; score_cut may then name an operating
# point ("fa10").
model_bundle = ""
# allowed: > 0. hdps docker/demo/config.yaml. A threshold in sigma: positive.
detect_sigma = 3.0
# allowed: a positive odd integer. A real/bogus score is a probability: a number 0..1, or with a model bundle one of
# its operating points ("fa10": 10 false alerts per deg2 per exposure, as hdps's production config). With every score
# 1, any number accepts every candidate.
score_cut = 0.5
# allowed: false | true. hdps default.
emit_all_candidates = false
# allowed: false | true. true (hdps default false): ref/sci/diff stamps with each alert.
emit_stamps = true
# allowed: a positive odd integer. hdps default. Odd, so the candidate sits on the centre pixel.
stamp_size = 31
# allowed: false. hdps docker/demo/config.yaml: no message broker here.
emit_kafka = false
# allowed: "csv" | "parquet". hdps default.
fmt = "parquet"

[[hdps.tasks]]
type = "TileImageOutputTask"
[hdps.tasks.config]
# allowed: false | true. hdps default false; true here: the field movie's images are hdps's tiles.
enabled = true
# allowed: any. hdps default "": the data-products sink.
output_dir = ""
# allowed: any. hdps default (output_dir).
science_output_dir = ""
# allowed: any. hdps default (output_dir).
difference_output_dir = ""
# allowed: false | true. hdps default.
save_science = true
# allowed: false | true. hdps default.
save_difference = true
# allowed: false | true. hdps default.
save_difference_variance = false
# allowed: false | true. false (hdps default true): exact float32 with NaN kept; RICE quantizes and maps NaN to 0.
compress = false
# allowed: any. hdps default (none: every tile).
tile_ids = "none"
# allowed: any. hdps default.
filename_prefix = "epoch"

[lightcurves]
# [arcsec] allowed: 0.1 .. 5.3. A detection joins the nearest object within this. Above ~1 px (1.0") so centroid noise
# links; below hdps's de-duplication radius (6 px, 6.0"), inside which two detections in one frame cannot both exist.
link_arcsec = 1.5

[truth]
# [px] allowed: 0.5 .. 6.0. Scoring only: a detection or candidate is a simulated star within this (tile px). Below
# hdps's de-dup radius (6 px).
match_radius = 2.0
# [arcsec] allowed: 0.5 .. 6.0. Scoring only: an alert is the simulated star within this of its position (hdps's tile
# WCS against the true position; the median WCS error is ~0.1"). About two pixels; below the 6 px de-dup radius so a
# neighbour is not taken.
alert_radius = 2.0

[output]
# allowed: a non-empty list of "beta", "rho". Argus bands kept (ArgusSim's filter_strategy has b, named g there, and
# rho).
bands = ["beta", "rho"]
# allowed: false | true. Render the movie (the third output).
movie = true
# allowed: false | true. Keep hdps's per-frame source catalogues.
catalogues = true
# allowed: false | true. Run difference imaging and keep hdps's alert products.
alerts = true
# allowed: false | true. Link detections into catalogue.csv and lightcurves/ (needs catalogues).
lightcurves = true
# allowed: false | true. Also render the pipeline movie (each raw frame on its sensor, hdps's detections and WCS);
# drawn from the same run, about 15-25% more time.
pipeline_movie = true
# allowed: false | true. Keep the raw camera frames (raw/); they are always written for hdps, and deleted after unless
# kept.
raw = false
# allowed: false | true. Save what both movies need (<name>_night_<band>.movie.joblib: each frame's block cut-outs, a
# 4 x 4-binned raw-frame preview, detections, WCS, measurements, alerts; ~1 MB per frame), so they can be drawn after
# the run (tools/render_movies.py) with movie = false during it.
movie_data = true
# [pixels] allowed: 0, or 100-4000. Field movie: its Exposure and Difference panels show the whole readout window,
# hdps's images of every tile it touches (TileImageOutputTask tile_ids: all, when the movie or its data is made) on
# the block's tile grid, each pixel the mean of a power-of-two square of tile pixels, the smallest that brings the
# frames' windows (their union) to at most this many pixels across. 800: f294's 56-minipix windows (placed on 8
# telescopes' sensors) span ~3100 tile pixels -> 4 x 4, 730 x 785 pixels, ~2 MB per frame more in the movie data; the
# panel is ~300 screen pixels at dpi 100 (drawn antialiased). Disk while the run lasts: 2 x 16 MB per tile per frame
# (f294: 4 tiles, 128 MB per frame against 32 MB for the block's tile alone; deleted at the end unless raw). 0: the
# block alone, from the tile it is in.
movie_window_px = 800
# allowed: 1.0 .. 10.0. Field movie, with movie_window_px: its panels show the central 1/zoom of the whole-window
# view, about the block, and the images cover only that, binned as movie_window_px says (so finer: f294 at 3, ~956"
# across, 2 x 2 tile pixels, ~545 pixels; at 1, 4 x 4); hdps writes only the tiles that view reaches. 1: the whole
# window (all of every frame's window, the view centred on them). Up to 10: f294's view is then ~290", about the 9 x 9
# block itself (closer: movie_window_px = 0, the block's own view).
movie_window_zoom = 1.0
# allowed: list of "window", "block". Field movies drawn from one run (each from its movie data, so
# tools/render_movies.py draws them all again): window, the whole readout window or its zoom about the block
# (movie_window_px, movie_window_zoom; <name>_night_<band>.mp4); block, the 9 x 9 block's own tile at hdps's pixels
# (<name>_night_<band>_block.mp4; the window view instead when movie_window_px = 0). The pipeline movie is
# pipeline_movie.
movie_views = ["window", "block"]
# [electrons] allowed: >= 0.0 (no upper limit). Field movies' Difference panel: pixels about the stars brighter than
# this in the frame's own reference coadd (electrons per tile pixel above its background; the coadd hdps subtracted,
# by its rule: the frame's camera, the deepest) are drawn grey. Saturated and bright stars keep a few % of their light
# in hdps's difference whatever the reference (f294 beta iter5, a reference of the night's own frames: the ~130
# brightest constant stars +4% net, the rest 0.1-0.3%), and draw the eye; the transients are not in the reference and
# stay. Display only: hdps, its alerts and the movie data are unchanged. 8000: about a third of the 60 s full well
# (21657 e-). 0: off.
movie_mask_reference_e = 8000.0
# [pixels] allowed: 0 .. 50. The grey disc about each masked pixel (tile pixels, 0.879") at movie_mask_reference_e;
# ~1.5 x the PSF's FWHM (2.6-3.2 tile pixels).
movie_mask_radius_px = 4
# [pixels] allowed: 0 .. 20. The disc's growth per magnitude a pixel is brighter than movie_mask_reference_e in the
# reference (a star's residual reaches further the brighter it is; hdps's bright-star mask grows the same way,
# SFFTSubtractionTask mask_dilation_growth).
movie_mask_growth_px = 2
# allowed: 1 .. 1000. Movie: every Nth frame.
stride = 1
# [frames/s] allowed: 1 .. 120. Movie frame rate.
fps = 24
# allowed: 50 .. 300. Movie resolution.
dpi = 100
# allowed: 0 .. 2147483647. Seed of the photon and read noise.
noise_seed = 3

# [[place]]: any number of built stars placed in the field (each key below).
# star: [] allowed any. A built star (stars/<name>/).
# x: [%] allowed -1000 .. 1000 | -1. Position across the block, percent from its left edge (outside 0..100: beyond the
# block, in the readout window, as [inject] places them); -1: random in the block. Ignored for a real Gaia star (its
# own position).
# y: [%] allowed -1000 .. 1000 | -1. Position up the block, percent from its bottom edge (as x); -1: random in the
# block.
# t0: [] allowed any. Transients: the model's t0 (ISO UTC, "start+D" days after the first exposure, or BJD).
# epoch: [] allowed any. Periodic stars: a primary eclipse / maximum (as t0).
# distance: [pc] allowed 0.0 .. 10000000.0. Distance for the dust in front of it (the 3D map); none: behind all the
# dust in its sightline, or the star's own.
# [[place]]
# star = "dwarf_nova_400pc"
# x = 60
# y = 40
# t0 = "start+0.05"
